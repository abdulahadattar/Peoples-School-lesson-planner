name: Repo Guard & Build

on:
  push:
    branches: [alpha, testing, main]
  pull_request:
    branches: [alpha, testing, main]

jobs:
  guard-and-build:
    name: Repo Guard & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify canonical Firebase config & secret guard
        run: node scripts/verify-repo-guard.mjs --strict

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
