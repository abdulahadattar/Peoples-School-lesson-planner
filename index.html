
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%233b82f6' stroke-width='8'%3E%3Cellipse cx='50' cy='50' rx='40' ry='12'/%3E%3Cellipse cx='50' cy='50' rx='40' ry='12' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='40' ry='12' transform='rotate(120 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='10' fill='%233b82f6'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Planner - Peoples Higher Secondary School Jamshoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              'brand-primary': 'var(--primary-color)',
              'brand-primary-hover': 'var(--primary-hover)',
              'brand-primary-soft': 'var(--primary-soft)',
              'brand-bg': 'var(--bg-color)',
              'brand-surface': 'var(--surface-color)',
              'brand-panel': 'var(--panel-color)',
              'brand-text-primary': 'var(--text-primary)',
              'brand-text-secondary': 'var(--text-secondary)',
              'brand-text-tertiary': 'var(--text-tertiary)',
              'brand-border': 'var(--border-color)',
              'brand-accent': 'var(--accent-color)',
            },
            boxShadow: {
              'soft': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1)',
              'card-hover': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-color: #f8fafc; /* Slate 50 */
        --surface-color: #ffffff;
        --panel-color: #f1f5f9; /* Slate 100 */
        --text-primary: #0f172a; /* Slate 900 */
        --text-secondary: #475569; /* Slate 600 */
        --text-tertiary: #94a3b8; /* Slate 400 */
        --border-color: #e2e8f0; /* Slate 200 */
        --primary-color: #3b82f6; /* Blue 500 */
        --primary-hover: #2563eb; /* Blue 600 */
        --primary-soft: #eff6ff; /* Blue 50 */
        --accent-color: #f8fafc;
      }

      .dark {
        --bg-color: #0f172a; /* Slate 900 */
        --surface-color: #1e293b; /* Slate 800 */
        --panel-color: #1e293b; /* Slate 800 */
        --text-primary: #f8fafc; /* Slate 50 */
        --text-secondary: #94a3b8; /* Slate 400 */
        --text-tertiary: #64748b; /* Slate 500 */
        --border-color: #334155; /* Slate 700 */
        --primary-color: #60a5fa; /* Blue 400 */
        --primary-hover: #3b82f6; /* Blue 500 */
        --primary-soft: #1e3a5f; /* Dark blue tint */
        --accent-color: #0f172a;
      }

      body {
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom Scrollbar for Webkit browsers */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--text-dark);
        border-radius: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--text-medium);
      }
      
      /* Style for the summary marker */
      summary {
        list-style: none; /* Remove default marker */
      }
      summary::-webkit-details-marker {
        display: none;
      }
      /* Better details animation support */
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }

      /* Custom animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .animate-slideUp {
        animation: slideUp 0.4s ease-out forwards;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js" defer></script>
</head>
  <body class="bg-brand-bg text-brand-text-light font-sans antialiased selection:bg-brand-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
