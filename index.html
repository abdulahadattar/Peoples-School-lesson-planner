    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              'brand-primary': 'var(--primary-color)',
              'brand-primary-hover': 'var(--primary-hover)',
              'brand-bg': 'var(--bg-color)',
              'brand-surface': 'var(--surface-color)',
              'brand-panel': 'var(--panel-color)',
              'brand-text-light': 'var(--text-light)',
              'brand-text-medium': 'var(--text-medium)',
              'brand-text-dark': 'var(--text-dark)',
              'brand-border': 'var(--border-color)',
              'brand-accent': 'var(--accent-color)',
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px var(--primary-color)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-color: #f3f4f6; /* Gray 100 */
        --surface-color: #ffffff;
        --panel-color: #e2e8f0; /* Slate 200 */
        --text-light: #1e293b; /* Slate 800 */
        --text-medium: #64748b; /* Slate 500 */
        --text-dark: #94a3b8; /* Slate 400 */
        --border-color: #e2e8f0; /* Slate 200 */
        --primary-color: #3b82f6; /* Blue 500 */
        --primary-hover: #2563eb; /* Blue 600 */
        --accent-color: #f8fafc;
      }

      .dark {
        --bg-color: #0f172a; /* Slate 900 */
        --surface-color: #1e293b; /* Slate 800 */
        --panel-color: #334155; /* Slate 700 */
        --text-light: #f1f5f9; /* Slate 100 */
        --text-medium: #94a3b8; /* Slate 400 */
        --text-dark: #64748b; /* Slate 500 */
        --border-color: #334155; /* Slate 700 */
        --primary-color: #38bdf8; /* Sky 400 */
        --primary-hover: #0ea5e9; /* Sky 500 */
        --accent-color: #0f172a;
      }

      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Custom Scrollbar for Webkit browsers */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--text-dark);
        border-radius: 20px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--text-medium);
      }
      
      /* Style for the summary marker */
      summary {
        list-style: none; /* Remove default marker */
      }
      summary::-webkit-details-marker {
        display: none;
      }
      /* Better details animation support */
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-KiWOvVjnN8qwZuNufXEypUHr/ROe9G7Akja23+cmPSUPoMinqKFSnbMyEWwKSbQN" crossorigin="anonymous">
