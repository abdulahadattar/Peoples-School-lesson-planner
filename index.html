
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='none' stroke='%233b82f6' stroke-width='8'%3E%3Cellipse cx='50' cy='50' rx='40' ry='12'/%3E%3Cellipse cx='50' cy='50' rx='40' ry='12' transform='rotate(60 50 50)'/%3E%3Cellipse cx='50' cy='50' rx='40' ry='12' transform='rotate(120 50 50)'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='10' fill='%233b82f6'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Planner - Peoples Higher Secondary School Jamshoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            },
            colors: {
              'brand-primary': 'var(--primary-color)',
              'brand-primary-hover': 'var(--primary-hover)',
              'brand-bg': 'var(--bg-color)',
              'brand-surface': 'var(--surface-color)',
              'brand-panel': 'var(--panel-color)',
              'brand-text-light': 'var(--text-light)',
              'brand-text-medium': 'var(--text-medium)',
              'brand-text-dark': 'var(--text-dark)',
              'brand-border': 'var(--border-color)',
              'brand-accent': 'var(--accent-color)',
            },
            boxShadow: {
              'soft': '0 2px 12px -2px rgba(0, 0, 0, 0.04)',
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.04), 0 6px 16px -4px rgba(0, 0, 0, 0.04)',
              'elevated': '0 4px 6px -2px rgba(0, 0, 0, 0.03), 0 12px 24px -8px rgba(0, 0, 0, 0.06)',
              'glow': '0 0 20px -4px var(--primary-color)',
              'inner-glow': 'inset 0 0 0 1px rgba(255,255,255,0.05)',
            },
            borderRadius: {
              '4xl': '2rem',
            },
            spacing: {
              '18': '4.5rem',
              '88': '22rem',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg-color: #f8fafc;
        --surface-color: #ffffff;
        --panel-color: #f1f5f9;
        --text-light: #0f172a;
        --text-medium: #475569;
        --text-dark: #94a3b8;
        --border-color: #e2e8f0;
        --primary-color: #6366f1;
        --primary-hover: #4f46e5;
        --accent-color: #eef2ff;
      }

      .dark {
        --bg-color: #0c0a1a;
        --surface-color: #1a1b2e;
        --panel-color: #232436;
        --text-light: #f1f5f9;
        --text-medium: #94a3b8;
        --text-dark: #64748b;
        --border-color: #2d2f45;
        --primary-color: #818cf8;
        --primary-hover: #6366f1;
        --accent-color: #1e1b4b;
      }

      body {
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Custom Scrollbar for Webkit browsers */
      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--text-dark);
        border-radius: 100px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--text-medium);
      }

      /* Style for the summary marker */
      summary {
        list-style: none;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }

      /* Custom animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(32px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .animate-slideUp {
        animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-scaleIn {
        animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Smooth select styling */
      select {
        background-image: none;
      }

      /* Number input spinners */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        opacity: 1;
        height: 28px;
      }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-KiWOvVjnN8qwZuNufXEypUHr/ROe9G7Akja23+cmPSUPoMinqKFSnbMyEWwKSbQN" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hIoBPJpTadBaddGWMizjMVELfLIsvALcvYlLBRou2R9XpasssnUBlG/B2i7rQxNB" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/Gf1I3a4KVRfvs0A6xbr2/WHoKkaNPsIsLevgrGmTPGNAcGma" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js" defer></script>
</head>
  <body class="bg-brand-bg text-brand-text-light font-sans antialiased selection:bg-brand-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
